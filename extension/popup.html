<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: sans-serif;
      margin: 0;
    }
    h2 { font-size: 16px; margin: 0 0 12px; }
    #url-text {
      font-size: 11px;
      color: #666;
      word-break: break-all;
      margin-bottom: 16px;
    }
    #result {
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
      font-size: 15px;
    }
    #score-text {
      text-align: center;
      font-size: 12px;
      color: #666;
      margin-top: 8px;
    }
    .safe     { background: #e6f4ea; color: #1e7e34; }
    .phishing { background: #fdecea; color: #c0392b; }
    .suspicious { background: #fff8e1; color: #b8860b; }
    #check-btn {
      width: 100%;
      margin-top: 12px;
      padding: 8px;
      border: none;
      border-radius: 6px;
      background: #4a4af4;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }
    #check-btn:hover { background: #3a3ae0; }
  </style>
</head>
<body>
  <h2>PhishGuard</h2>
  <div id="url-text">—</div>
  <div id="result">Click the button to check</div>
  <div id="score-text"></div>
  <button id="check-btn">Check site</button>
  <script src="popup.js"></script>
</body>
</html>
